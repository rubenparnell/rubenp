<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruben</title>

    <style>
        :root {
            --durham-purple: #443853;
            --durham-light: #611c63;
            --text-dark: #222;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                         Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 40px;
            color: var(--text-dark);
        }

        h4 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: var(--durham-purple);
        }

        ul {
            list-style: none;
            padding: 0;
            max-width: 500px;
        }

        li {
            background: white;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #d0d7e2;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        a {
            color: var(--durham-purple);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: var(--durham-light);
            text-decoration: underline;
        }

        small {
            display: block;
            margin-top: 4px;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <h4>Durham Links</h4>

    <ul>
        <li>
            <a href="https://mytimetable.durham.ac.uk/weekly/activities/">My Timetable</a>
        </li>

        <li>
            <a href="https://durhamuniversity.sharepoint.com/sites/MyDigitalDurham/SitePages/AudioVisual.aspx#see-what-av-equipment-is-in-each-room">
                Room Locator
            </a>
            <small>(Click the x then find a room in the dropdown)</small>
        </li>

        <li>
            <a href="https://ban-ssb.durham.ac.uk/ssomanager/saml/login?relayState=/c/auth/SSB">
                Banner Self Service
            </a>
        </li>

        <li>
            <a href="https://dur.unidesk.ac.uk/tas/public/ssp/">
                CIS Self Service Portal
            </a>
        </li>
    </ul>
</body>
</html>
